# Colliding Spheres Test Configuration
# Two spheres colliding head-on with initial velocities

_particle_template: &sphere_particle
  Density: 1000
  Material: matP
  CrustThickness: 1.0e-4
  ParticleShape: '<Sphere Radius="0.1"/>'

Constant:
  Simulation:
    SimType: Standard
    Precision: Double
  DomainOrigin:
    X: -0.25
    Y: -0.25
    Z: 0.0
  DomainSize:
    X: 0.5
    Y: 0.5
    Z: 1.0
  CollisionDetection:
    NeighborListType: BruteForce
    BoundingVolumeType: OBB
    NarrowPhaseType: GJK
  ContactModelsList:
    - Type: Hooke
      MaterialA: matP
      MaterialB: matP
      Parameters: 'kn="5.e4" en="0.8" etat="0" muc="0" kr="0"'
  Temporal:
    TStart: 0.0
    TEnd: 0.025
    DT: 1.0e-8
  ParticlesList:
    - <<: *sphere_particle
      Number: 1
    - <<: *sphere_particle
      Number: 1
  Forces:
    Gravity:
      GX: 0.0
      GY: 0.0
      GZ: 0.0
  Insertion:
    ForceInsertion: 1
    InitialPosition:
      Type: File
      Name: ./collidingSpheres/collidingSpheres_position.dat
    InitialOrientation:
      Type: Zero
    InitialVelocity:
      Type: File
      Name: ./collidingSpheres/collidingSpheres_velocity.dat
    InitialAngularVelocity:
      Type: Zero
  PostProcessing:
    TimeSave:
      Start: 0.0
      End: 0.025
      DT: 0.0001
  SimulationSettings:
    WritersSection:
      - Type: Raw
        Directory: ./results/collidingSpheres
        RootName: collidingSpheres
