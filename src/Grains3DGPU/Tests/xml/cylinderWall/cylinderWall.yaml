Constant:
  DomainOrigin:
    X: -0.05
    Y: -0.05
    Z: 0
  CollisionDetection:
    NeighborListType: BruteForce
    LinkedCellType: Host
    CellSizeFactor: 1.0
    UpdateFrequency: 0
    SortingFrequency: 0
    BoundingVolumeType: OBB
  ContactModel:
    ContactModelType: Hooke
    MaterialA: matP
    MaterialB: matP
    Parameters: 'kn="1.e5" en="0.85" etat="1.e5" muc="0" kr="0"'
  Temporal:
    TStart: 0.0
    TEnd: 1e-2
    DT: 1e-7
    TimeIntegrationType: FirstOrderExplicit
  ParticlesList:
    - Number: 1
      Density: 1163
      Material: matP
      CrustThickness: 1e-5
      ParticleShape: '<Cylinder Radius="0.004" Height="0.006"/>'
      AngularPosition:
        aX: 0
        aY: 0
        aZ: 0
  ObstaclesList:
    - Name: Rectangle
      Material: matP
      CrustThickness: 1e-5
      ObstacleShape: '<Rectangle LX="0.1" LY="0.1"/>'
      ObstaclePosition:
        X: 0
        Y: 0
        Z: 0
      ObstacleAngularPosition:
        aX: 0
        aY: 0
        aZ: 0
  Forces:
    Gravity:
      GX: 0.0
      GY: 0.0
      GZ: 0.0
  Insertion:
    ForceInsertion: 1
    InitialPosition:
      Type: Random
      Seed:
        Mode: Default
      Windows:
        - Type: Box
          MinPoint:
            X: 0
            Y: 0
            Z: 0.01
          MaxPoint:
            X: 0
            Y: 0
            Z: 0.01
    InitialVelocity:
      Type: Constant
      X: 0
      Y: 0
      Z: -1.0
    InitialOrientation:
      Type: Zero
  PostProcessing:
    TimeSave:
      Start: 0.0
      End: 1e-2
      DT: 1e-7

