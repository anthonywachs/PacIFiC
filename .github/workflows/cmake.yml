name: CMake

on:
  push:
    branches: [master, macos]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: Default 
          - os: macos-latest
            preset: Mac OS X (ARM)

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y \
              build-essential \
              cmake \
              pkg-config \
              openmpi-bin \
              libopenmpi-dev \
              libxerces-c-dev \
              zlib1g-dev \
              libhdf5-openmpi-dev \
              petsc-dev
          elif [ "${{ runner.os }}" = "macOS" ]; then
            brew update
            brew install \
              cmake \
              pkg-config \
              open-mpi \
              xerces-c \
              zlib \
              hdf5-mpi \
              petsc
          fi

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}" --parallel 2

      - name: Test
        run: ctest --preset "${{ matrix.preset }}"
